# tooling. Keep the token out of version control.
bot_token = ""
# Deny-by-default: only these chat ids may use the bot (renders cost compute
# and API credits). Message the bot once -- it replies with your chat id.
allowed_chats = []                     # e.g. ["272967534"]
# Defaults for bot-triggered renders
language = ""                          # "ru"/"en" drives the voice switch; "" = auto
voice_name = ""                        # "" = let the language switch pick
video_source = "pexels"
paragraph_number = 1
timeout = 30                           # Bot API request timeout, seconds
# Autopilot: scheduled news -> video -> Telegram with no manual step.
# Renders the freshest unseen news item every N hours, once per language,
# and delivers the mp4s to autopilot_chat_id. Off by default (renders cost
# compute/credits).
autopilot_enabled = false
autopilot_chat_id = ""                 # chat that receives the scheduled videos
autopilot_interval_hours = 6
autopilot_languages = ["ru", "en"]     # one render per language per news item

[ui]
# UI related settings
# 是否隐藏日志信息
# Whether to hide logs in the UI
hide_log = false

# 字幕位置设置 (Subtitle position settings)
# 可选值 (Available values): "top", "center", "bottom", "custom"
# subtitle_position = "custom"
# 自定义位置，表示离顶部的百分比 (0-100)，仅当 subtitle_position = "custom" 时生效
# Custom position as percentage from top (0-100), only effective when subtitle_position = "custom"
# custom_position = 70.0

# 字幕样式 (Caption style):
#   "karaoke" -> CapCut/TikTok 逐词高亮字幕（默认）
#                word-by-word highlight, current word colored + scaled (default)
#   "tiktok"  -> 全大写 + 粗描边 + 投影 (ALL-CAPS, heavy outline + drop shadow)
#   "outline" -> 干净的描边文字，无背景框 (clean outlined text, no box)
#   "shadow"  -> 描边 + 投影 (outline + soft drop shadow)
#   "box"     -> 传统纯色背景框 (legacy solid background box)
# subtitle_style = "karaoke"
# 卡拉OK样式当前朗读单词的高亮颜色 (highlight color for the spoken word in karaoke)
# subtitle_highlight_color = "#FFE600"

########## Upload-Post (Cross-post to TikTok/Instagram)
# Upload-Post allows you to automatically cross-post generated videos to TikTok and Instagram.
# Visit https://upload-post.com to create an account and get your API key.
# API Documentation: https://docs.upload-post.com

# Enable/disable Upload-Post integration
upload_post_enabled = false

# Your Upload-Post API key
upload_post_api_key = ""

# Your Upload-Post username
upload_post_username = ""

# Platforms to cross-post to (options: "tiktok", "instagram")
upload_post_platforms = ["tiktok", "instagram"]

# Automatically cross-post videos after generation (if false, you'll need to call the API manually)
upload_post_auto_upload = false

########## Audio polish (SFX + ducking)
# Sound effects played at scene-cut points (whoosh, pop, etc.).
# Regenerate assets: python tools/make_sfx.py
sfx_enabled = true
# Master volume multiplier for all SFX clips (0.0 = mute, 1.0 = full).
sfx_volume = 0.6

# BGM ducking: lower background music volume while the narrator is speaking so
# the voice stays intelligible; the music swells back up in narration gaps.
bgm_ducking_enabled = true
# BGM volume while voice is active (0.0 – 1.0). bgm_volume (set elsewhere)
# applies in silent gaps and at the end.
bgm_duck_volume = 0.15
