[app]
video_source = "pexels" # "pexels" or "pixabay"

# 是否隐藏配置面板
hide_config = false

# Azure TTS V1(edge_tts) 单次流式请求超时时间，单位秒。
# 网络异常、服务端限流或 voice 与文本语言不匹配时，edge_tts 可能长期卡住。
# 默认 30 秒可避免 WebUI 任务无反馈；慢网络或代理环境可适当调大。
# 设置为 0 表示禁用超时。
edge_tts_timeout = 30

# 是否校验外部 API 和素材下载的 TLS 证书。
# 默认必须开启，避免 Pexels/Pixabay API key 和下载素材被中间人攻击篡改。
# 只有在企业代理或自签证书环境明确需要时，才临时改为 false。
tls_verify = true

# Pexels API Key
# Register at https://www.pexels.com/api/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pexels_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# 特别注意格式，Key 用英文双引号括起来，多个Key用逗号隔开
pexels_api_keys = []

# Pixabay API Key
# Register at https://pixabay.com/api/docs/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pixabay_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# 特别注意格式，Key 用英文双引号括起来，多个Key用逗号隔开
pixabay_api_keys = []

# 支持的提供商 (Supported providers):
#   openai
#   moonshot    (月之暗面)
#   azure
#   qwen        (通义千问)
#   deepseek
#   gemini
#   ollama
#   g4f        (disabled by default; set enable_g4f=true only after accepting its risks)
#   oneapi
#   cloudflare
#   minimax
#   ernie       (文心一言)
#   modelscope  (魔搭社区)
#   litellm     (100+ providers via LiteLLM gateway)
llm_provider = "nvidia"

########## Pollinations AI Settings
# Visit https://pollinations.ai/ to learn more
# API Key is optional - leave empty for public access
pollinations_api_key = ""
# Default base URL for Pollinations API
pollinations_base_url = "https://pollinations.ai/api/v1"
# Default model for text generation
pollinations_model_name = "openai-fast"

########## Ollama Settings
# No need to set it unless you want to use your own proxy
ollama_base_url = ""
# Check your available models at https://ollama.com/library
ollama_model_name = ""

########## OpenAI API Key
# Get your API key at https://platform.openai.com/api-keys
# 也可以填写兼容 OpenAI Chat Completions 协议的供应商密钥，
# 例如 OpenRouter 这类提供自定义 base_url 的平台。
openai_api_key = ""
# No need to set it unless you want to use your own proxy
# 如果使用兼容 OpenAI 接口的平台，请在这里填写对应的 base_url。
openai_base_url = ""
# Check your available models at https://platform.openai.com/account/limits
# 如果使用兼容供应商，请填写该平台要求的模型 ID。
openai_model_name = "gpt-4o-mini"

########## Moonshot API Key
# Visit https://platform.moonshot.cn/console/api-keys to get your API key.
moonshot_api_key = ""
moonshot_base_url = "https://api.moonshot.cn/v1"
moonshot_model_name = "moonshot-v1-8k"

########## OneAPI API Key
# Visit https://github.com/songquanpeng/one-api to get your API key
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

########## G4F
# g4f relies on reverse-engineered third-party endpoints and is not recommended
# for production. Prefer official APIs, OpenAI-compatible providers, LiteLLM,
# Ollama, or local inference.
# If you still need it, install the optional dependency with:
#   uv sync --extra g4f
enable_g4f = false
# Visit https://github.com/xtekky/gpt4free to get more details
# Supported model list: https://github.com/xtekky/gpt4free/blob/main/g4f/models.py
g4f_model_name = "gpt-3.5-turbo"

########## Azure API Key
# Visit https://learn.microsoft.com/zh-cn/azure/ai-services/openai/ to get more details
# API documentation: https://learn.microsoft.com/zh-cn/azure/ai-services/openai/reference
azure_api_key = ""
azure_base_url = ""
azure_model_name = "gpt-35-turbo"        # replace with your model deployment name
azure_api_version = "2024-02-15-preview"

########## Gemini API Key
gemini_api_key = ""
gemini_model_name = "gemini-2.5-flash"

########## Grok API Key
grok_api_key = ""
grok_model_name = "grok-4.3"
grok_base_url = "https://api.x.ai/v1"

########## NVIDIA NIM API Key
# Visit https://build.nvidia.com to get your API key (starts with nvapi-)
nvidia_api_key = ""
nvidia_base_url = "https://integrate.api.nvidia.com/v1"
nvidia_model_name = "stepfun-ai/step-3.7-flash"

########## Vision (understand local photos/videos)
# When enabled, local materials (images + sampled video frames) are analyzed by
# a vision model so the generated script and stock search terms reflect the real
# content. Costs a few cheap vision calls per video.
# IMPORTANT: vision_model_name MUST be a multimodal/VLM model. A text-only model
# (e.g. mistral-large / most *-instruct text models) cannot see images.
vision_enabled = false
vision_provider = "nvidia"
vision_model_name = "meta/llama-3.2-11b-vision-instruct"
vision_base_url = "https://integrate.api.nvidia.com/v1"
vision_api_key = ""  # falls back to nvidia_api_key when empty; set VISION_API_KEY in .env
vision_seconds_per_frame = 5
vision_max_frames = 4

########## Pinterest (scrape themed photos)
# When enabled, photos matching the video subject are scraped from Pinterest,
# analyzed by the vision model (so they inform the script + search terms), and
# blended into the final video alongside stock footage. Works on top of any
# video_source. Best paired with vision_enabled = true.
# NOTE: this uses Pinterest's unofficial search endpoint (no API key). It can
# break if Pinterest changes it; failures are non-fatal and generation falls
# back to stock/local materials.
pinterest_enabled = false
pinterest_count = 6

########## Vision cache + concurrency
# Vision descriptions are cached on disk by file content, so the same photo/clip
# is never re-analyzed across runs (instant + free on repeat runs). Materials are
# analyzed in parallel up to vision_concurrency workers.
vision_cache = true
vision_concurrency = 4

########## Resumability
# When true, re-running a task with the same task_id reuses already-produced
# artifacts (script.json, audio.mp3, subtitle.srt) instead of regenerating them.
resume = true

########## AI video generation (pluggable, off by default)
# Generate motion clips with an AI model and blend them in alongside stock
# footage. Designed for autonomous use: results are cached by prompt/image, and
# the budget caps below bound cost per run. All failures are non-fatal -- the
# pipeline falls back to stock/local media.
#
# provider:
#   null      -> disabled (default; nothing is generated)
#   replicate -> Replicate predictions API (set video_gen_api_key + video_gen_model=<version hash>)
#   fal       -> fal.ai queue API        (set video_gen_api_key + video_gen_model=<route e.g. fal-ai/ltx-video>)
#   http      -> your own GPU service (Google Cloud Run+GPU / Modal / RunPod);
#                set video_gen_endpoint to a server exposing POST /submit + GET /status/{job}
#   azure-sora-> Azure OpenAI Sora (runs on the startup credits). Set
#                video_gen_endpoint = "https://<resource>.openai.azure.com" and
#                video_gen_api_key; video_gen_model defaults to "sora".
#                ⚠️ Azure sunsets this API on 2026-09-24 -- after that switch back to null.
# mode: image2video animates the on-theme photos we already fetch (cheaper, more
#       coherent); text2video generates from the search terms. image2video is used
#       automatically whenever an init image is available.
video_gen_enabled = false
video_gen_provider = "null"
video_gen_model = ""
video_gen_api_key = ""        # set VIDEO_GEN_API_KEY in .env to keep it out of config
video_gen_endpoint = ""       # only for provider = "http"
video_gen_mode = "image2video"
video_gen_max_clips = 4       # hard cap on clips generated per video
video_gen_max_seconds = 60    # hard cap on total generated seconds per video
video_gen_timeout = 300       # seconds to wait for a single clip before giving up
video_gen_poll_interval = 5   # seconds between status polls

########## Talking head
# Optional presenter video layer, used by video_visual_mode = "news" (a talking
# head composited into a corner of the news layout). All failures are non-fatal:
# the news video is still produced without the head, with burned captions instead.
#
# provider:
#   auto    -> Azure TTS Avatar first, then Wav2Lip fallback
#   azure   -> Azure TTS Avatar batch API only
#   wav2lip -> local audio+portrait lip sync only
#
# Azure uses the existing [azure].speech_key and [azure].speech_region values
# below. Do not duplicate those credentials in this block.
avatar_enabled = false
avatar_provider = "auto"
avatar_character = "lisa"              # Azure standard avatar catalog character
avatar_style = "casual-sitting"        # Azure standard avatar style
# Voice for the Azure avatar's built-in TTS. Leave empty to follow the voice
# the pipeline actually narrated with (best lip sync); set it only to force a
# specific Azure voice. Mismatched voices drift out of sync.
avatar_voice = ""
avatar_portrait = ""                   # portrait photo path for Wav2Lip/custom photo
avatar_prefer_alpha = true             # use webm/vp9+transparent when confirmed available
avatar_alpha_supported = false         # set true only in regions/accounts that support it
avatar_fps = 25
avatar_timeout = 900
avatar_poll_interval = 5
avatar_azure_api_version = "3.1-preview1"
avatar_azure_endpoint = ""             # override full Azure endpoint only if needed

# Wav2Lip fallback. Run setup-avatar.bat once to create .venv-wav2lip, clone the
# reference Wav2Lip repo, and download wav2lip_gan.pth. Missing pieces simply
# make the provider return "".
wav2lip_python = ""                    # override .venv-wav2lip interpreter
wav2lip_repo = ""                      # override .wav2lip/Wav2Lip
wav2lip_script = ""                    # override inference.py
wav2lip_weights = ""                   # override models/wav2lip/wav2lip_gan.pth
wav2lip_timeout = 1800
wav2lip_resize_factor = ""

# Where the presenter sits in the news layout (video_visual_mode = "news"). The
# lower-third plate stays in the lower-left, so bottom-right is the safe default.
news_presenter_scale = 0.38            # presenter width as a fraction of frame width
news_presenter_position = "bottom-right"  # bottom-right | bottom-left | top-right | top-left
news_presenter_margin = 0.04           # corner inset as a fraction of frame width

########## News sources (for the news-video pipeline)
# news.latest() walks these in priority order and uses the first source that
# yields items: Threads profiles first (scraped from the public profile page --
# fragile by nature), then RSS feeds (stable fallback). Everything degrades to
# an empty list, never crashes the pipeline.
news_threads_profiles = []             # e.g. ["bbcnews", "rbc_ru"] (usernames, no @)
news_rss_feeds = [
    "https://feeds.bbci.co.uk/news/world/rss.xml",
    # RU examples: "https://lenta.ru/rss/news", "https://www.vedomosti.ru/rss/news"
]
news_fetch_timeout = 15                # seconds per HTTP request

########## Language switch (RU/EN voices)
# When a task's video_language is Russian or English (any tag form: "ru",
# "ru-RU", "en-US", ...), the pipeline picks the TTS voice automatically and
# retries down the chain on failure:
#   primary  = Azure Neural TTS (azure-v2), used only when [azure].speech_key
#              and speech_region below are set
#   fallback = key-less voice: RU -> local Qwen3-TTS (run setup-qwen.bat once),
#              EN -> free edge-tts
# An explicitly chosen voice_name still leads when it matches the language;
# a mismatched one is demoted to last resort instead of dropped. Without a
# recognized video_language, voice_name is used alone (legacy behavior).
voice_ru_primary = "ru-RU-DmitryNeural-V2-Male"
voice_ru_fallback = "qwen:Russian:ryan-Male"
voice_en_primary = "en-US-AndrewMultilingualNeural-V2-Male"
voice_en_fallback = "en-US-AndrewNeural-Male"

########## Hyperframes (motion-graphics video)
# Build the whole video from motion graphics instead of stock footage: an LLM
# authors an HTML/GSAP composition (kinetic typography, animated numbers/lists)
# timed to the TTS narration, and hyperframes renders it to MP4 locally (headless
# Chrome + ffmpeg). Great for text-driven explainer/finance shorts; not a
# replacement for scenic b-roll. Run setup-hyperframes.bat once to install the
# toolchain. All failures are non-fatal -- the pipeline falls back to stock footage.
# video_visual_mode selects how the visual track is built (overrides hyperframes_enabled):
#   "footage"     stock/local footage only (default)
#   "hyperframes" solely motion-graphics, timed to the narration
#   "mixed"       the "director": the LLM tags each scene as real footage or motion
#                 graphics; footage scenes stay native, MG scenes are rendered, and the
#                 segments are stitched together in order.
#   "news"        deterministic news layout: persistent headline plate + per-scene
#                 lower-third over a motion background, with an optional talking-head
#                 presenter in a corner (see the Talking head block above). Captions
#                 are burned only when no presenter could be produced.
## quiz/ranking ## ----------------------------------------------------------
#   "quiz"        trivia format: the LLM writes N questions as strict JSON; per question
#                 the video shows a question card, an animated 3-2-1 countdown beat (the
#                 narration speaks "three... two... one..." so the beat is audio-synced),
#                 then an answer-reveal card with a one-line fun fact.
#   "ranking"     "Top N" countdown: the LLM writes a ranked Top-N list as strict JSON;
#                 the video counts down #N -> #1 with slamming rank badges and a suspense
#                 beat before #1.
#   "chat"        messenger story: the LLM writes a two-person SMS dialogue as strict JSON
#                 (hook -> escalation -> twist); rendered as a phone chat where bubbles pop
#                 in one at a time, synced to a single-voice narration of the exchange.
# Both build their own narration from structured LLM JSON; any LLM/JSON failure degrades
# non-fatally to the regular subject-driven script + normal visual track.
## end quiz/ranking ## ------------------------------------------------------
# Leave empty to fall back to hyperframes_enabled below.
video_visual_mode = ""
hyperframes_enabled = false   # solely-hyperframes mode (equivalent to video_visual_mode="hyperframes")
# Authoring engine for motion-graphics compositions:
#   "studio"   -> deterministic templates (default): each scene is classified into an
#                 archetype (stat counter / kinetic statement) and rendered from
#                 hardened templates -- no overlapping text, no black frames, no LLM in
#                 the layout loop. Most reliable for production.
#   "freeform" -> the LLM authors the whole HTML/CSS/GSAP document (more creative,
#                 less predictable). Studio falls back to this automatically if it ever
#                 fails to produce a valid composition.
hyperframes_engine = "studio"
# Maximum scene duration (seconds) for motion-graphics modes. Long scenes are
# split at word/phrase boundaries so the visual changes more often (retention).
# Set <= 0 to disable splitting. Only affects hyperframes-rendered scenes.
scene_max_seconds = 4.0
hyperframes_dir = ".hyperframes"   # project dir created by setup-hyperframes.bat
hyperframes_version = "0.6.58"     # pinned CLI version for reproducible renders
hyperframes_node = ""         # optional dir containing node/npx; else found on PATH
hyperframes_fps = 30
hyperframes_timeout = 600     # seconds to wait for a single render before giving up
# Real photo backgrounds behind motion-graphics scenes (solely + mixed). Pulled from
# the stock photo APIs and staged into .hyperframes/assets/ (a local file, so the
# render stays deterministic). hyperframes_image_provider defaults to video_source.
hyperframes_images = true
hyperframes_image_provider = ""   # "pexels" | "pixabay" | "" (follow video_source)
hyperframes_bg_count = 2          # background photos fetched per motion-graphics scene
# The hyperframes composition already renders the narration as kinetic typography,
# so the burned .srt caption is suppressed by default to avoid two text layers
# colliding. Set true only if you want the .srt subtitles burned on top as well.
hyperframes_burn_subtitles = false
# Preview pass (solely mode): before the full-rate render, render a fast low-fps
# proxy, sample one frame per scene, flag near-empty/black scenes, and write a
# contact-sheet PNG to the task dir for a quick eyeball. Off by default (the proxy
# adds time). hyperframes_preview_fps controls the proxy frame rate.
hyperframes_preview = false
hyperframes_preview_fps = 3

########## Qwen3-TTS (local voice, isolated env)
# A high-quality local neural TTS (more natural than Silero, supports Russian +
# 9 other languages). Because qwen-tts has heavy/conflicting deps, it lives in a
# separate environment (.venv-qwen) created by setup-qwen.bat and is called via a
# subprocess. In the WebUI pick TTS Server = "Qwen3-TTS (local)".
# Uses the NVIDIA GPU automatically when available (CPU fallback otherwise).
qwen_tts_model = "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
qwen_tts_language = "Russian"   # default language for the voice list
qwen_tts_timeout = 1800         # max seconds for one synthesis subprocess
# qwen_tts_python = ""          # override path to the .venv-qwen interpreter

########## Qwen API Key
# Visit https://dashscope.console.aliyun.com/apiKey to get your API key
# Visit below links to get more details
# https://tongyi.aliyun.com/qianwen/
# https://help.aliyun.com/zh/dashscope/developer-reference/model-introduction
qwen_api_key = ""
qwen_model_name = "qwen-max"


########## MiniMax API Key
# Visit https://platform.minimax.io to get your API key
# MiniMax API is OpenAI-compatible
# Available models: MiniMax-M2.7 (default), MiniMax-M2.7-highspeed
minimax_api_key = ""
minimax_base_url = "https://api.minimax.io/v1"
minimax_model_name = "MiniMax-M2.7"

########## DeepSeek API Key
# Visit https://platform.deepseek.com/api_keys to get your API key
deepseek_api_key = ""
deepseek_base_url = "https://api.deepseek.com"
deepseek_model_name = "deepseek-chat"


########## ModelScope API Key
# Visit https://modelscope.cn/docs/model-service/API-Inference/intro to get your API key
# And note that you need to bind your Alibaba Cloud account before using the API.
modelscope_api_key = ""
modelscope_base_url = "https://api-inference.modelscope.cn/v1/"
modelscope_model_name = "Qwen/Qwen3-32B"

########## LiteLLM (AI Gateway — 100+ providers)
# LiteLLM routes to any LLM provider via a unified interface.
# Use this for providers not directly supported above: Anthropic (native API),
# AWS Bedrock, Google Vertex AI, Cohere, Mistral, Together AI, etc.
# Visit https://docs.litellm.ai/docs/providers for the full list.
#
# LiteLLM reads provider API keys from environment variables automatically:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, AWS_ACCESS_KEY_ID, etc.
# Set the appropriate env var for your chosen provider before running.
#
# Model name in LiteLLM format: "provider/model-name"
# Examples: "openai/gpt-4o", "anthropic/claude-sonnet-4-20250514",
#           "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0",
#           "gemini/gemini-2.5-flash", "ollama/llama3"
litellm_model_name = "openai/gpt-4o-mini"

# Subtitle Provider, "edge" or "whisper"
# If empty, the subtitle will not be generated
subtitle_provider = "edge"

#
# ImageMagick
#
# Once you have installed it, ImageMagick will be automatically detected, except on Windows!
# On Windows, for example "C:\Program Files (x86)\ImageMagick-7.1.1-Q16-HDRI\magick.exe"
# Download from https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-29-Q16-x64-static.exe

# imagemagick_path = "C:\\Program Files (x86)\\ImageMagick-7.1.1-Q16\\magick.exe"


#
# FFMPEG
#
# 通常情况下，ffmpeg 会被自动下载，并且会被自动检测到。
# 但是如果你的环境有问题，无法自动下载，可能会遇到如下错误：
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# 此时你可以手动下载 ffmpeg 并设置 ffmpeg_path，下载地址：https://www.gyan.dev/ffmpeg/builds/

# Under normal circumstances, ffmpeg is downloaded automatically and detected automatically.
# However, if there is an issue with your environment that prevents automatic downloading, you might encounter the following error:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# In such cases, you can manually download ffmpeg and set the ffmpeg_path, download link: https://www.gyan.dev/ffmpeg/builds/

# ffmpeg_path = "C:\\Users\\harry\\Downloads\\ffmpeg.exe"
#########################################################################################

# 当视频生成成功后，API服务提供的视频下载接入点，默认为当前服务的地址和监听端口
# 比如 http://127.0.0.1:8080/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# 如果你需要使用域名对外提供服务（一般会用nginx做代理），则可以设置为你的域名
# 比如 https://xxxx.com/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# endpoint="https://xxxx.com"

# When the video is successfully generated, the API service provides a download endpoint for the video, defaulting to the service's current address and listening port.
# For example, http://127.0.0.1:8080/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# If you need to provide the service externally using a domain name (usually done with nginx as a proxy), you can set it to your domain name.
# For example, https://xxxx.com/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# endpoint="https://xxxx.com"
endpoint = ""


# Video material storage location
# material_directory = ""                    # Indicates that video materials will be downloaded to the default folder, the default folder is ./storage/cache_videos under the current project
# material_directory = "/user/harry/videos"  # Indicates that video materials will be downloaded to a specified folder
# material_directory = "task"                # Indicates that video materials will be downloaded to the current task's folder, this method does not allow sharing of already downloaded video materials

# 视频素材存放位置
# material_directory = ""                    #表示将视频素材下载到默认的文件夹，默认文件夹为当前项目下的 ./storage/cache_videos
# material_directory = "/user/harry/videos"  #表示将视频素材下载到指定的文件夹中
# material_directory = "task"                #表示将视频素材下载到当前任务的文件夹中，这种方式无法共享已经下载的视频素材

material_directory = ""

# Used for state management of the task
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# 文生视频时的最大并发任务数
max_concurrent_tasks = 5

# 并发任务已满后的最大排队任务数，超过后接口返回 429，避免匿名请求无限堆积
max_queued_tasks = 100


[whisper]
# Only effective when subtitle_provider is "whisper"

# Run on GPU with FP16
